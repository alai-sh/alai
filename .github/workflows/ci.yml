name: Alai CLI CI

on:
  push:
    branches:
      - main
    tags:
      # A version tag also drafts its GitHub release, with the sdist and wheels; publishing that draft publishes to PyPI
      # (publish.yml). Tag the release with the PEP 440 version alai reports, as the build checks they match.
      #   TAG="v$(uv run alai --version | cut -d ' ' -f 2)" && git tag -a "$TAG" -m "$TAG" && git push origin "$TAG"
      - 'v*'

  pull_request:
    branches:
      - main

permissions: {}

env:
  # These versions are kept strict to support reproducible builds.
  UV_VERSION: "0.13.5"  # Keep in sync with docs.yml
  MATURIN_VERSION: "v1.15.0"
  # The exact Python versions used to build the wheels for macOS
  MACOS_PYTHONS: "3.10.22 3.14.9t 3.15.1t"
  MANYLINUX2014_X86_64: quay.io/pypa/manylinux2014_x86_64@sha256:3a591c1109773dbd79f16c038588fd1867d9f2f708b360dab5715852c7f96ef0
  MANYLINUX2014_AARCH64: quay.io/pypa/manylinux2014_aarch64@sha256:00260f8334f8358554592c35d33f1b6daa064a3c95725328624b4823dc07bf81
  MUSLLINUX_1_2_X86_64: quay.io/pypa/musllinux_1_2_x86_64@sha256:773cb7e73652e4596eba6a9d593b01278f86772641d6530a6660422d30e50f36
  MUSLLINUX_1_2_AARCH64: quay.io/pypa/musllinux_1_2_aarch64@sha256:98f93110a91c028291c902e55619154c5522c57ccecef1f9eedcc2f1177aad12

jobs:
  sanity:
    name: Sanity
    runs-on: ubuntu-26.04
    permissions:
      contents: read  # Repo checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          cache-suffix: sanity

      - name: Install Rust
        run: rustup toolchain install

      - name: Check uv.lock is up to date
        run: uv lock --check

      - name: Run sanity checks
        run: |
          uv sync --no-install-project
          uv run --no-sync tox run -f sanity

  rust-version:
    name: Rust version
    runs-on: ubuntu-26.04
    permissions:
      contents: read  # Repo checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check with the declared rust-version
        run: |
          rustup toolchain install
          RUST_VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].rust_version')"
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          cargo "+${RUST_VERSION}" check --locked --release

  sdist:
    name: Build sdist
    needs: sanity
    runs-on: ubuntu-26.04
    permissions:
      contents: read  # Repo checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          cache-suffix: sdist

      - name: Build
        run: uv build --sdist

      - name: Verify tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PROJECT_VERSION="$(tar -xzOf dist/*.tar.gz --wildcards '*/PKG-INFO' | sed -n 's/^Version: //p')"
          if [ "${GITHUB_REF_NAME}" != "v${PROJECT_VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match project version ${PROJECT_VERSION}"
            exit 1
          fi

      # Builds the extension from the sdist, as an install from it on a platform with no wheel would.
      - name: Smoke test
        run: uvx --from ./dist/*.tar.gz alai --version

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist/
          if-no-files-found: error

  wheels:
    name: Build wheels (${{ matrix.platform.name }})
    needs: sanity
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read  # Repo checkout
    strategy:
      fail-fast: false
      matrix:
        platform:
          # container-env names the env variable holding the build container, as a matrix can't read env itself.
          - name: linux-x86_64
            runner: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
            manylinux: "2014"
            container-env: MANYLINUX2014_X86_64
          - name: linux-aarch64
            runner: ubuntu-26.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2014"
            container-env: MANYLINUX2014_AARCH64
          - name: linux-x86_64-musl
            runner: ubuntu-26.04
            target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2
            container-env: MUSLLINUX_1_2_X86_64
          - name: linux-aarch64-musl
            runner: ubuntu-26.04-arm
            target: aarch64-unknown-linux-musl
            manylinux: musllinux_1_2
            container-env: MUSLLINUX_1_2_AARCH64
          - name: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            manylinux: "off"
            container-env: ""
    env:
      # Apple Silicon's first macOS, Rust's minimum for it.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          cache-suffix: wheels-${{ matrix.platform.name }}

      - name: Install Pythons on non-Linux hosts
        if: runner.os == 'macOS'
        run: |
          uv python install ${MACOS_PYTHONS}
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Build the abi3 wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          container: ${{ env[matrix.platform.container-env] }}
          args: --release --locked --compatibility pypi --out dist -i python3.10

      - name: Build the cp314t wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          container: ${{ env[matrix.platform.container-env] }}
          args: --release --locked --compatibility pypi --out dist -i python3.14t

      - name: Build the abi3.abi3t wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          container: ${{ env[matrix.platform.container-env] }}
          args: --release --locked --compatibility pypi --out dist -i python3.15t

      - name: Check there are three wheels
        run: |
          ls dist
          test "$(ls dist/*.whl | wc -l)" -eq 3

      # We only check the abi3 wheel, the abi3t wheels are not supported by abi3audit currently
      # https://github.com/pypa/abi3audit/issues/215
      - name: Check the abi3 wheel uses only the stable ABI
        run: uvx abi3audit --strict --report dist/*-cp310-abi3-*.whl

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.platform.name }}
          path: dist/
          if-no-files-found: error

  test:
    name: Test (${{ matrix.wheels }}, Python ${{ matrix.python-version }})
    needs: wheels
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read  # Repo checkout
    strategy:
      fail-fast: false
      matrix:
        # Linux is cheap to run so we use the full matrix there, other platforms
        # we test the oldest and newest supported versions.
        include:
          - {runner: ubuntu-26.04, wheels: linux-x86_64, python-version: "3.10"}
          - {runner: ubuntu-26.04, wheels: linux-x86_64, python-version: "3.11"}
          - {runner: ubuntu-26.04, wheels: linux-x86_64, python-version: "3.12"}
          - {runner: ubuntu-26.04, wheels: linux-x86_64, python-version: "3.13"}
          - {runner: ubuntu-26.04, wheels: linux-x86_64, python-version: "3.14"}
          - {runner: ubuntu-26.04, wheels: linux-x86_64, python-version: "3.15"}
          - {runner: ubuntu-26.04, wheels: linux-x86_64, python-version: "3.14t"}
          - {runner: ubuntu-26.04, wheels: linux-x86_64, python-version: "3.15t"}
          - {runner: ubuntu-26.04-arm, wheels: linux-aarch64, python-version: "3.10"}
          - {runner: ubuntu-26.04-arm, wheels: linux-aarch64, python-version: "3.15"}
          - {runner: ubuntu-26.04-arm, wheels: linux-aarch64, python-version: "3.14t"}
          - {runner: ubuntu-26.04-arm, wheels: linux-aarch64, python-version: "3.15t"}
          - {runner: macos-latest, wheels: macos-arm64, python-version: "3.10"}
          - {runner: macos-latest, wheels: macos-arm64, python-version: "3.15"}
          - {runner: macos-latest, wheels: macos-arm64, python-version: "3.14t"}
          - {runner: macos-latest, wheels: macos-arm64, python-version: "3.15t"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          cache-suffix: test-${{ matrix.python-version }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels-${{ matrix.wheels }}
          path: dist/

      - name: Run tests
        run: |
          case "${PYTHON_VERSION}" in
            3.15|3.15t) ABI=cp315-abi3.abi3t ;;
            3.14t) ABI=cp314-cp314t ;;
            *) ABI=cp310-abi3 ;;
          esac
          TOX_PYTHON="py$(echo "${PYTHON_VERSION}" | tr -d .)"
          # tox and the tools only, not alai, which is the wheel given.
          uv sync --no-install-project
          uv run --no-sync tox run -f "${TOX_PYTHON}" --installpkg dist/alai_sh-*-"${ABI}"-*.whl
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
          PYTEST_ADDOPTS: --color=yes

  test-musl:
    name: Test (${{ matrix.wheels }}, Python ${{ matrix.python-version }})
    needs: wheels
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read  # Repo checkout
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-26.04
          - ubuntu-26.04-arm
        python-version:
          - "3.10"
          - "3.15"
          - "3.14t"
          - "3.15t"
        include:
          - runner: ubuntu-26.04
            wheels: linux-x86_64-musl
          - runner: ubuntu-26.04-arm
            wheels: linux-aarch64-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels-${{ matrix.wheels }}
          path: dist/

      - name: Run tests on Alpine
        run: |
          case "${PYTHON_VERSION}" in
            3.15|3.15t) ABI=cp315-abi3.abi3t ;;
            3.14t) ABI=cp314-cp314t ;;
            *) ABI=cp310-abi3 ;;
          esac
          docker run --rm -v "${PWD}:/src" -w /src -e "ABI=${ABI}" -e PYTHON_VERSION "ghcr.io/astral-sh/uv:${UV_VERSION}-alpine" sh -euc '
            apk add --no-cache git
            # What alai and the test group need, at the versions uv.lock pins, as tox installs them on the other jobs;
            # then the wheel for this ABI on its own.
            export UV_PROJECT_ENVIRONMENT=/venv
            uv sync --locked --python "${PYTHON_VERSION}" --no-install-project --no-default-groups --group test
            uv pip install --python /venv --no-deps dist/alai_sh-*-"${ABI}"-*.whl
            /venv/bin/python -m pytest -p no:cacheprovider -n auto --color=yes tests
          '
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}

  draft:
    name: Draft release
    needs:
      - rust-version
      - sdist
      - test
      - test-musl
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    permissions:
      contents: write  # Create the draft release
      id-token: write  # Sigstore signing certificate, for the attestations
      attestations: write  # Store the attestations
      artifact-metadata: write  # The attestations' storage records
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist/
          merge-multiple: true

      # publish.yml only uploads files these attestations show were built here from the tag.
      - name: Attest the sdist and wheels
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if is_draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$is_draft" != "true" ]; then
              echo "::error::Release $TAG is already published, its assets cannot be changed. Release a new version instead."
              exit 1
            fi

            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* \
              --draft \
              --verify-tag \
              --title "$TAG" \
              --generate-notes \
              --repo "$GITHUB_REPOSITORY"
          fi
