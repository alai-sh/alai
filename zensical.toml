# The user documentation at docs.alai.sh, built from docs/ with
# `uv run --group docs zensical build --strict`. Design notes live in design/
# and aren't published.

[project]
site_name = "alai"
site_description = "A fast package and environment manager for Ansible collections."
site_url = "https://docs.alai.sh/"
repo_url = "https://github.com/alai-sh/alai"
repo_name = "alai-sh/alai"
copyright = "Copyright &copy; 2026 Jordan Borean"

nav = [
  { "Home" = "index.md" },
  { "Projects" = "projects.md" },
  { "Managing collections" = "managing-collections.md" },
  { "Collection sources" = "collection-sources.md" },
  { "Running Ansible" = "running-ansible.md" },
  { "Editors" = "editors.md" },
  { "Installing by hand" = "installing-by-hand.md" },
  { "Finding plugins" = "finding-plugins.md" },
  { "Coming from ansible-galaxy" = "ansible-galaxy.md" },
  { "Configuration" = "configuration.md" },
  { "Indexes" = "indexes.md" },
  { "alai.toml" = "alai-toml.md" },
  { "Shell completion" = "shell-completion.md" },
  { "CLI reference" = "cli.md" },
  { "Roadmap" = "roadmap.md" },
  { "Acknowledgements" = "acknowledgements.md" },
  { "alai-index docs" = "https://alai.sh/alai-index/" },
  { "alai-doc docs" = "https://alai.sh/alai-doc/" },
]

# The terminal recordings, copied in by python -m cli_recorder assets.
extra_css = [
  "assets/cli-recorder/asciinema-player/asciinema-player.css",
  "assets/cli-recorder/cast.css",
  "assets/cli-recorder/ansi.css",
]
extra_javascript = [
  "assets/cli-recorder/asciinema-player/asciinema-player.min.js",
  "assets/cli-recorder/cast.js",
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# Kept to plain Markdown plus callouts and highlighted code, so the content
# moves to another generator without rewriting.
[project.markdown_extensions]
admonition = {}
attr_list = {}
toc.permalink = true
pymdownx.highlight = {}
pymdownx.superfences = {}

# The Open Graph tags and a card image per page, for link previews in Discord,
# Slack and the like. Fetches its font on the first build into .cache/.
[project.plugins.social]
